<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Supabase Debug</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: monospace; padding: 20px;">
    <h1>Supabase Debug</h1>
    <pre id="log">Initializing...</pre>

    <script>
        const log = (msg) => {
            document.getElementById('log').innerHTML += '\n' + msg;
            console.log(msg);
        };

        try {
            log('1. Checking supabase global...');
            log('   typeof supabase: ' + typeof supabase);
            log('   typeof window.supabase: ' + typeof window.supabase);
            
            if (typeof window.supabase === 'undefined') {
                log('   ERROR: window.supabase is undefined!');
                throw new Error('Supabase not loaded');
            }

            log('\n2. Creating client...');
            const SUPABASE_URL = 'https://wgzxexklnndethybiipm.supabase.co';
            const SUPABASE_ANON_KEY = 'sb_publishable_DAC1AlPLDy_pHpc23-ukUw_XQCS5VG7';
            const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            log('   Client created: ' + typeof client);

            log('\n3. Fetching data from web_apps...');
            client
                .from('web_apps')
                .select('*')
                .order('sort_order', { ascending: true })
                .then(({ data, error }) => {
                    if (error) {
                        log('   ERROR: ' + JSON.stringify(error, null, 2));
                    } else {
                        log('   SUCCESS! Got ' + data.length + ' rows');
                        if (data.length > 0) {
                            log('\n4. First row:');
                            log(JSON.stringify(data[0], null, 2));
                        }
                    }
                })
                .catch(err => {
                    log('   CATCH ERROR: ' + err.message);
                });

        } catch (err) {
            log('\nFATAL ERROR: ' + err.message);
            log(err.stack);
        }
    </script>
</body>
</html>
